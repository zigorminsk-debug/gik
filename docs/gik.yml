name: Gik Android builder

on:
  workflow_dispatch:
    inputs:
      task:
        description: Product specification
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Save specification
        run: |
          mkdir -p .gik
          cat > .gik/task.txt <<'TASK'
          ${{ inputs.task }}
          TASK

      - name: Generate code with Arena
        env:
          ARENA_API_URL: ${{ secrets.ARENA_API_URL }}
          ARENA_API_KEY: ${{ secrets.ARENA_API_KEY }}
        run: python3 .gik/arena_generate.py

      - name: Commit generated project
        run: |
          git config user.name "gik-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Generate Android project from task"
          git push

      - name: Check Android project
        id: check
        run: |
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Gradle project not generated yet, skipping APK build."
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Android SDK packages
        if: steps.check.outputs.android == 'true'
        run: |
          set -eu
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        if: steps.check.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        if: steps.check.outputs.android == 'true'
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: steps.check.outputs.android == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gik-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
