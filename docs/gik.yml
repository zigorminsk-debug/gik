name: Gik Android builder
on:
  workflow_dispatch:
    inputs:
      task:
        description: Product specification
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      # Replace this step with your audited generator action/script.
      # Keep provider keys in repository Settings > Secrets and variables > Actions.
      - name: Save specification
        run: |
          mkdir -p .gik
          cat > .gik/task.txt <<'EOF'
          ${{ inputs.task }}
          EOF
      - name: Generate code with Arena
        env:
          ARENA_API_URL: ${{ secrets.ARENA_API_URL }}
          ARENA_API_KEY: ${{ secrets.ARENA_API_KEY }}
        run: |
          python3 docs/scripts/arena_generate.py
          test -f gradlew || { echo "Arena must create an Android Gradle project."; exit 1; }
      - name: Commit generated project
        run: |
          git config user.name "gik-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Generate Android project from task"
          git push
      - name: Set up Android build tools
        uses: android-actions/setup-android@v3
      - name: Build APK on GitHub
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gik-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
